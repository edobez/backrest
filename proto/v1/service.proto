syntax = "proto3";

package v1;

option go_package = "github.com/garethgeorge/backrest/gen/go/v1";

import "v1/config.proto";
import "v1/restic.proto";
import "v1/operations.proto";
import "types/value.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

message BackupRequest {
  string value = 1; // plan_id - named 'value' for curl script backwards compatibility
  bool dry_run = 2; // optional, simulate backup without creating snapshot
}

// ScheduleTaskResponse is returned by RPCs that schedule a task for later execution.
message ScheduleTaskResponse {
  int64 operation_id = 1; // ID of the scheduled operation, or 0 when no operation was created for the task.
}

// VersionInfo describes the running backend build.
message VersionInfo {
  string version = 1; // human readable version, e.g. "1.9.2" or "dev+abc1234"
  string commit = 2; // git commit hash, or "unknown"
  bool is_dev_build = 3; // true if the build was not stamped with a release version via ldflags
}

service Backrest {
  rpc GetConfig (google.protobuf.Empty) returns (Config) {}

  rpc SetConfig (Config) returns (Config) {}

  rpc SetupSftp (SetupSftpRequest) returns (SetupSftpResponse) {}

  rpc CheckRepoExists (CheckRepoExistsRequest) returns (CheckRepoExistsResponse) {} // returns an error if the repo does not exist

  rpc AddRepo (AddRepoRequest) returns (Config) {}

  rpc RemoveRepo (RemoveRepoRequest) returns (Config) {} // removes a repo from the config and deletes its history, does not delete the repo on disk

  rpc GetOperationEvents (google.protobuf.Empty) returns (stream OperationEvent) {}

  rpc GetOperations (GetOperationsRequest) returns (OperationList) {}

  rpc ListSnapshots(ListSnapshotsRequest) returns (ResticSnapshotList) {}

  rpc ListSnapshotFiles(ListSnapshotFilesRequest) returns (ListSnapshotFilesResponse) {}

  // ListSources returns the snapshot sources (hostname + paths, as restic's `--group-by host,paths`) of a repo,
  // computed from the indexed snapshots.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse) {}

  // PreviewAdoptedSource resolves an adopted source rule with a lock-free dry run and returns the
  // matched sources and the snapshots the rule would keep and remove. Nothing is modified.
  rpc PreviewAdoptedSource(PreviewAdoptedSourceRequest) returns (PreviewAdoptedSourceResponse) {}

  // Backup schedules a backup operation. It accepts a plan id and returns empty if the task is enqueued.
  rpc Backup(BackupRequest) returns (google.protobuf.Empty) {}

  // DoRepoTask schedules a repo task. It accepts a repo id and a task type and returns the scheduled operation's ID.
  rpc DoRepoTask(DoRepoTaskRequest) returns (ScheduleTaskResponse) {}

  // Forget schedules a forget operation. It accepts a plan id and returns the scheduled operation's ID.
  rpc Forget(ForgetRequest) returns (ScheduleTaskResponse) {}

  // Restore schedules a restore operation.
  rpc Restore(RestoreSnapshotRequest) returns (ScheduleTaskResponse) {}

  // Cancel attempts to cancel a task with the given operation ID. Not guaranteed to succeed.
  rpc Cancel(CancelOperationRequest) returns (google.protobuf.Empty) {}

  // GetLogs returns the keyed large data for the given operation.
  rpc GetLogs(LogDataRequest) returns (stream types.BytesValue) {}

  // RunCommand executes a generic restic command on the repository.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse) {}

  // GetDownloadURL returns a signed download URL given an operation ID and file path.
  rpc GetDownloadURL(GetDownloadURLRequest) returns (types.StringValue) {}

  // Clears the history of operations
  rpc ClearHistory(ClearHistoryRequest) returns (google.protobuf.Empty) {}

  // PathAutocomplete provides path autocompletion options for a given filesystem path.
  rpc PathAutocomplete (types.StringValue) returns (types.StringList) {}

  // GetVersion returns the version and commit of the running backend.
  rpc GetVersion(google.protobuf.Empty) returns (VersionInfo) {}

  // GetSummaryDashboard returns data for the dashboard view.
  rpc GetSummaryDashboard(google.protobuf.Empty) returns (SummaryDashboardResponse) {}

  // GeneratePairingToken creates a new pairing token on the server that can be shared with clients to simplify peering.
  // The token format is "<keyid>:<secret>#<instanceid>" — an opaque string the client pastes when adding a known host.
  rpc GeneratePairingToken(GeneratePairingTokenRequest) returns (GeneratePairingTokenResponse) {}
}

// OpSelector is a message that can be used to select operations e.g. by query.
message OpSelector {
  repeated int64 ids = 1;
  optional string instance_id = 6;
  optional string original_instance_keyid = 8;
  optional string repo_guid = 7;
  optional string plan_id = 3;
  optional string snapshot_id = 4;
  optional int64 flow_id = 5;
  optional int64 modno_gte = 9;
}

message SetupSftpRequest {
  string host = 1;
  string port = 2;
  string username = 3;
  optional string password = 4; // If not provided, we only generate the key and add host to known_hosts
}

message SetupSftpResponse {
  string public_key = 1;
  string key_path = 2;
  string known_hosts_path = 3;
  string error = 4;
}

message CheckRepoExistsRequest {
  Repo repo = 1;
}

message CheckRepoExistsResponse {
  bool exists = 1;
  string error = 2;
  bool host_key_untrusted = 5;
}

message AddRepoRequest {
  Repo repo = 1;
}

message DoRepoTaskRequest {
  string repo_id = 1;
  enum Task {
    TASK_NONE = 0;
    TASK_INDEX_SNAPSHOTS = 1;
    TASK_PRUNE = 2;
    TASK_CHECK = 3;
    TASK_STATS = 4;
    TASK_UNLOCK = 5;
    TASK_FORGET = 6;
  }
  Task task = 2;
}

message ClearHistoryRequest {
  OpSelector selector = 1;
  bool only_failed = 2;
}

message ForgetRequest {
  string repo_id = 1;
  string plan_id = 2;
  string snapshot_id = 3;
}

message ListSnapshotsRequest {
  string repo_id = 1;
  string plan_id = 2;
  string source_id = 3; // optional, restricts the result to snapshots of exactly this source (see SnapshotSource.id).
}

message ListSourcesRequest {
  string repo_id = 1;
}

message ListSourcesResponse {
  repeated SnapshotSource sources = 1;
}

message PreviewAdoptedSourceRequest {
  string repo_id = 1;
  AdoptedSource rule = 2;
}

message PreviewAdoptedSourceResponse {
  repeated AdoptedSourceMatch matches = 1;
}

// AdoptedSourceMatch is one source matched by an adopted source rule.
message AdoptedSourceMatch {
  SnapshotSource source = 1;
  repeated ResticSnapshot keep = 2;
  repeated ResticSnapshot remove = 3; // empty when the source is refused.
  string refused_reason = 4; // set when the rule does not manage this source. Refusals are errors unless skipped is set.
  bool skipped = 5; // the source contains only plan snapshots, so it is managed by its plan and ignored by the rule. Not an error.
}

// SnapshotSource groups snapshots by (hostname, sorted paths), the same key restic uses for `--group-by host,paths`.
// Tags are not part of the key.
message SnapshotSource {
  string id = 1; // stable ID derived from hostname and sorted paths, independent of the repo.
  string repo_id = 2;
  string hostname = 3;
  repeated string paths = 4; // sorted.
  repeated string plan_ids = 5; // distinct plan IDs (from `plan:` tags) of its snapshots, empty for external snapshots.
  repeated string instance_ids = 6; // distinct instance IDs (from `created-by:` tags) of its snapshots.
  int64 snapshot_count = 7; // number of snapshots not yet forgotten.
  int64 first_snapshot_time_ms = 8;
  int64 last_snapshot_time_ms = 9;
  string last_snapshot_id = 10;
  int64 last_snapshot_bytes = 11; // logical size (total_bytes_processed) of the latest snapshot, 0 if unknown.
}

message GetOperationsRequest {
  OpSelector selector = 1;
  int64 last_n = 2; // limit to the last n operations
}

message RestoreSnapshotRequest {
  string plan_id = 1;
  string repo_id = 5;
  string snapshot_id = 2;
  string path = 3;
  string target = 4;
}

message ListSnapshotFilesRequest {
  string repo_id = 1;
  string snapshot_id = 2;
  string path = 3;
}

message ListSnapshotFilesResponse {
  string path = 1;
  repeated LsEntry entries = 2;
}

message LogDataRequest {
  string ref = 1;
}

message GetDownloadURLRequest {
  int64 op_id = 1;
  string file_path = 2;
}

message LsEntry {
  string name = 1;
  string type = 2;
  string path = 3;
  int64 uid = 4;
  int64 gid = 5;
  int64 size = 6;
  int64 mode = 7;
  string mtime = 8;
  string atime = 9;
  string ctime = 10;
}

message RunCommandRequest {
  string repo_id = 1;
  string command = 2;
}

message RunCommandResponse {
  int64 operation_id = 1;
}

message RemoveRepoRequest {
  string repo_id = 1;
}

message CancelOperationRequest {
  int64 operation_id = 1;
}

message SummaryDashboardResponse {
  repeated Summary repo_summaries = 1;
  repeated Summary plan_summaries = 2;

  string config_path = 10;
  string data_path = 11;

  message Summary {
    string id = 1;
    int64 backups_failed_30days = 2;
    int64 backups_warning_last_30days = 3;
    int64 backups_success_last_30days = 4;
    int64 bytes_scanned_last_30days = 5;
    int64 bytes_added_last_30days = 6;
    int64 total_snapshots = 7;
    int64 bytes_scanned_avg = 8;
    int64 bytes_added_avg = 9;
    int64 next_backup_time_ms = 10;

    // Charts
    BackupChart recent_backups = 11; // recent backups

    int64 protected_bytes = 12; // total bytes processed by the most recent successful/warning backup
    repeated DayStatusBucket history_last_30days = 13; // per-day backup status for the dashboard history strip, oldest first; absent days precede the plan's first backup
  }

  message BackupChart {
    repeated int64 flow_id = 1;
    repeated int64 timestamp_ms = 2;
    repeated int64 duration_ms = 3;
    repeated OperationStatus status = 4;
    repeated int64 bytes_added = 5;
  }

  message DayStatusBucket {
    int64 timestamp_ms = 1; // start-of-day timestamp this bucket represents
    int64 bytes_added = 2; // bytes added by backups that day
    int64 bytes_scanned = 3; // bytes scanned by backups that day
    repeated StatusAndCount status_counts = 4; // backup count per status for the day
    bool overdue = 5; // gap since the last good backup exceeded the schedule's nominal period during this day
  }

  message StatusAndCount {
    int64 count = 1;
    OperationStatus status = 2;
  }
}

message GeneratePairingTokenRequest {
  string label = 1; // human-readable label for the token
  int64 ttl_seconds = 2; // time-to-live in seconds (e.g. 3600 for 1 hour)
  int32 max_uses = 3; // max number of clients that can pair with this token, 0 for unlimited
  repeated Multihost.Permission permissions = 4; // permissions to grant to clients that pair with this token
}

message GeneratePairingTokenResponse {
  string token = 1; // the opaque pairing token string: "<keyid>:<secret>#<instanceid>"
}
